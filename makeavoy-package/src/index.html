  <body>
    <div id="main"></div>

  <script>
    // Get canvas and WebGL context
    const canvas = document.getElementById("canvas");
    const gl =
      canvas.getContext("webgl") || canvas.getContext("experimental-webgl");

    if (!gl) {
      alert("WebGL not supported");
      throw new Error("WebGL not supported");
    }

    // Resize canvas to fill window
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Vertex shader (simple quad)
    const vertexShaderSource = `
            attribute vec2 a_position;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

    const fragmentShaderSource = `
            precision mediump float;
            uniform vec3 iResolution;
            uniform float iTime;
            uniform vec4 iMouse;

            vec3 waver(float y,float val,vec3 color,vec3 target) {
                if (y < val) {
                    color = target;
                }else if(y<val+0.1){
                    float shadowStrength = smoothstep(val,val + 0.1 , y)*.3 +.7;
                    color*=shadowStrength;
                }
                return color;
            }

            void mainImage( out vec4 fragColor, in vec2 fragCoord ) {

                vec2 uv = fragCoord / iResolution.xy;

                float time = iTime * 0.4;

                float xx=uv.x;
                float xo=1.-uv.x;
                xo=1.-uv.x;
                xo*=xo;
                xo+=0.3;

                float wave1 = sin(xx * 3.0 + time) * 0.15 +
                              sin(xx * 5.0 + time * 1.2) * 0.08 +
                              sin(xx * 8.0 + time * 0.8) * 0.04;
                wave1 += 0.3*xo;


                float wave2 = sin(xx * 2.5 + time * 0.7) * 0.12 +
                              sin(xx * 4.0 + time * 0.9) * 0.06 +
                              sin(xx * 7.0 + time * 0.5) * 0.03;
                wave2 += 0.5*xo;


                float wave3 = sin(xx * 2.0 + time * 0.4) * 0.08 +
                              sin(xx * 3.5 + time * 0.6) * 0.04 +
                              sin(xx * 6.0 + time * 0.3) * 0.02;
                wave3 += 0.7*xo;


                float wave4 = sin(xx * 1.5 + time * 0.2) * 0.05 +
                              sin(xx * 2.8 + time * 0.4) * 0.03;
                wave4 += 0.85*xo;

                //vec3 color1 = vec3(1.0, 0.3, 0.5);
                //vec3 color2 = vec3(1.0, 0.5, 0.2);
                //vec3 color3 = vec3(0.4, 0.7, 1.0);
                //vec3 bgColor = vec3(0.1, 0.3, 0.7);

                vec3 color1 = vec3(.45, .53, .70);
                vec3 color2= vec3(0.984, 0.659, 0.659);
                vec3 color3=vec3(.71, .84, .57);

                vec3 bgColor = vec3(0.95294, 0.93725, 0.89019);

                vec3 color4 = mix(color3,bgColor,.4);

                vec2 st = fragCoord.xy / iResolution.xy;


                vec3 finalColor = bgColor;

                finalColor=waver(uv.y,wave4,finalColor,color4);

                finalColor=waver(uv.y,wave3,finalColor,color3);

                finalColor=waver(uv.y,wave2,finalColor,color2);

                finalColor=waver(uv.y,wave1,finalColor,color1);


                float atmosphere = smoothstep(0.0, 1.0, uv.y);
                finalColor = mix(finalColor, bgColor * 1.2, atmosphere * 0.3);

                fragColor = vec4(finalColor, 1.0);
            }
            void main() {
                mainImage(gl_FragColor, gl_FragCoord.xy);
            }
                `;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error("Shader compile error:", gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    function createProgram(gl, vertexShader, fragmentShader) {
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error("Program link error:", gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
        return null;
      }
      return program;
    }

    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = createShader(
      gl,
      gl.FRAGMENT_SHADER,
      fragmentShaderSource,
    );
    const program = createProgram(gl, vertexShader, fragmentShader);

    const positionLocation = gl.getAttribLocation(program, "a_position");
    const resolutionLocation = gl.getUniformLocation(program, "iResolution");
    const timeLocation = gl.getUniformLocation(program, "iTime");
    const mouseLocation = gl.getUniformLocation(program, "iMouse");

    const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);

    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    // Mouse tracking
    // let mouseX = 0,
    //   mouseY = 0;
    // let mouseDown = false;
    //
    // canvas.addEventListener("mousemove", (e) => {
    //   mouseX = e.clientX;
    //   mouseY = canvas.height - e.clientY; // Flip Y coordinate
    // });
    //
    // canvas.addEventListener("mousedown", () => (mouseDown = true));
    // canvas.addEventListener("mouseup", () => (mouseDown = false));

    function render(time) {
      time *= 0.001; // Convert to seconds

      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.uniform3f(resolutionLocation, canvas.width, canvas.height, 1.0);
      gl.uniform1f(timeLocation, time);
      // gl.uniform4f(mouseLocation, mouseX, mouseY, mouseDown ? 1.0 : 0.0, 0.0);

      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
